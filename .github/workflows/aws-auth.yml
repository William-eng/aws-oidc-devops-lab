name: AWS OIDC Authorization Test

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::975050251876:role/github-actions-deploy-dev
          aws-region: us-east-1
          role-session-name: github-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Test allowed S3 operation
        run: |
          aws s3api list-objects-v2 \
            --bucket aws-oidc-lab-975050251876

      - name: Test denied S3 upload
        shell: bash
        run: |
          set +e
          output=$(aws s3api put-object \
            --bucket aws-oidc-lab-975050251876 \
            --key unauthorized-test.txt \
            --body README.md 2>&1)
          status=$?
          set -e

          if [ "$status" -ne 0 ] && \
             echo "$output" | grep -q "AccessDenied"; then
            echo "SECURITY TEST PASSED: AWS explicitly denied PutObject."
          else
            echo "$output"
            echo "SECURITY TEST FAILED: Unexpected upload result."
            exit 1
          fi